<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Курс таджвида</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1a2e;--ink-mid:#3d3d5c;--ink-soft:#8a8aa0;--accent:#1e3a5f;--gold:#c8972a;--gold-light:#f0e0b0;--heavy:#6B1D2C;--bg:#faf9f7}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1623;font-family:Inter,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.wrap{background:var(--bg);border-radius:24px;max-width:720px;width:100%;padding:44px 28px 36px;position:relative;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.wrap::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold) 70%,transparent)}
.ar{font-family:Amiri,serif;font-size:46px;color:var(--gold);text-align:center;direction:rtl;line-height:1.6}
h1{font-size:30px;font-weight:800;color:var(--ink);text-align:center;margin-top:2px}
.sub{font-size:17px;color:var(--ink-soft);text-align:center;margin-top:8px}
.cards{display:flex;flex-direction:column;gap:16px;margin-top:30px}
a.card{display:flex;align-items:center;gap:20px;text-decoration:none;background:#fff;border:1.5px solid #e8e4dc;border-left:8px solid var(--heavy);border-radius:18px;padding:20px 22px;box-shadow:0 2px 12px rgba(26,26,46,.07);transition:transform .15s}
a.card:hover{transform:translateY(-3px)}
a.card.one{border-left-color:var(--accent)}
.num{flex:0 0 46px;height:46px;border-radius:50%;background:var(--heavy);color:#fff;font-weight:800;font-size:21px;display:flex;align-items:center;justify-content:center}
.one .num{background:var(--accent)}
.t{font-size:22px;font-weight:800;color:var(--ink)}
.d{font-size:15px;color:var(--ink-mid);margin-top:3px;line-height:1.4}
.note{margin-top:26px;background:var(--gold-light);border-radius:14px;padding:14px 18px;font-size:15px;color:var(--ink);line-height:1.5;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<div class="ar">عِلۡمُ ٱلتَّجۡوِيدِ</div>
<h1>Курс таджвида</h1>
<div class="sub">Выберите уровень</div>
<div class="cards">
<!--KURS1-->
<a class="card" href="kurs-2.html"><div class="num">2</div><div><div class="t">Второй уровень</div><div class="d">Полнозвучные буквы, гунна, мим и нун с сукуном, Ра, калькаля, мадд</div></div></a>
</div>
<div class="note">На телефоне держите экран вертикально. Листайте кнопками «Назад» и «Вперёд» внизу страницы.</div>
</div>
</body>
</html>
